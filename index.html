<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link data-trunk rel="rust" />
<style>
@font-face {
  font-family: 'Atkinson Hyperlegible Next';
  font-style: normal;
  font-weight: 200 800;
  font-display: swap;
  src: url(/fonts/ahn-normal.woff2) format('woff2');
}

@font-face {
  font-family: 'Atkinson Hyperlegible Next';
  font-style: italic;
  font-weight: 200 800;
  font-display: swap;
  src: url(/fonts/ahn-italic.woff2) format('woff2');
}

html {
    font-family: Atkinson Hyperlegible Next, sans-serif;
    font-size: 11.5pt;
}

body {
    text-align: left;
    display: flex;
    flex-direction: row;
    background: #f7f5f2;
    margin: 25px auto;
    max-width: 980px;
}

main {
    display: block;
    margin-left: 50px;
}

nav {
    max-width: 160px;
    min-width: 160px;
}

h1 {
    font-size: 23pt;
    color: #4f9f5f;
}

h2 {
    font-size: 20pt;
}

h3 {
    font-size: 15pt;
    color: #1f6f2f;
}

h4 {
    font-size: 12.5pt;
}

hr {
    width: 90%;
}

table.array {
    table-layout: fixed;
    border-collapse: separate;
}

.elem {
    font-size: 0.85em;
    font-family: monospace;
    width: 1em;
    height: 1em;
    border: 2px solid #888;
    padding: 0.1em;
}

.elem.swp {
    color: #fff;
    background: #2f4f8f;
    border: 2px solid #001;
}

td.td-bar {
    width: 1em;
    vertical-align: bottom;
}

.bar {
    background: #3f6f4f;
}

.bar.swp {
    background: #2f4f8f;
}

.bar-enclosure {
    display: grid;
    padding: 0.2em;
    justify-content: center;
}

a {
    color: #911;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

a:active {
    color: #800;
}

a.btn {
    display: block;
    border: 1px solid black;
    padding: 0.08em 0.7em;
    text-align: center;
    color: #fff;
    background: #b22;
    text-decoration: none;
}

a.btn:hover {
    background: #800;
}

a.btn:active {
    background: #000;
}

a.btn:after {
    content: " →";
}

a.nav {
    display: block;
    border: 1px solid black;
    padding: 0.08em 0.7em;
    color: #000;
    background: #fff;
    text-decoration: none;
    margin-bottom: 0.35em;
    width: 80%;
    box-shadow: 3px 3px #8e8b89;
}

a.nav:hover {
    color: #fff;
    background: #222;
}

a.nav.sel, a.nav:active {
    color: #fff;
    background: #000;
}
</style>
    </head>
</html>
