@font-face {
  font-family: 'Atkinson Hyperlegible Next';
  font-style: normal;
  font-weight: 200 800;
  font-display: swap;
  src: url(/fonts/ahn-normal.woff2) format('woff2');
}

@font-face {
  font-family: 'Atkinson Hyperlegible Next';
  font-style: italic;
  font-weight: 200 800;
  font-display: swap;
  src: url(/fonts/ahn-italic.woff2) format('woff2');
}

html {
    font-family: Atkinson Hyperlegible Next, sans-serif;
    font-size: 11.5pt;
}

body {
    text-align: left;
    display: flex;
    flex-direction: row;
    background: #f7f5f2;
    margin: 25px auto;
    max-width: 980px;
}

main {
    display: block;
    margin-left: 50px;
}

nav {
    max-width: 160px;
    min-width: 160px;
}

h1 {
    font-size: 23pt;
    color: #4f9f5f;
}

h2 {
    font-size: 20pt;
}

h3 {
    font-size: 15pt;
    font-variant: small-caps;
    font-weight: 800;
    color: #1f6f2f;
}

h4 {
    font-size: 12.5pt;
}

hr {
    width: 90%;
}

table.array {
    table-layout: fixed;
    border-collapse: separate;
}

.elem {
    font-size: 0.85em;
    font-family: monospace;
    width: 1em;
    height: 1em;
    border: 2px solid #888;
    padding: 0.1em;
}

.elem.pad {
    border: 2px dashed #99a;
}

.elem.swp {
    color: #fff;
    background: #2f4f8f;
    border: 2px solid #001;
}

.elem.spc {
    border: 2px solid #000;
    background: #ffd060;
}

.elem.spc.swp {
    border: 2px solid #001;
    color: #fff;
    background: #2f4f8f;
    background: linear-gradient(
        135deg,
        #cfa030 30%,
        #2f4f8f 70%
    );
}

td.td-bar {
    width: 1em;
    vertical-align: bottom;
}

.bar {
    background: #3f6f4f;
}

.bar.swp {
    background: #2f4f8f;
}

.bar-enclosure {
    display: grid;
    padding: 0.2em;
    justify-content: center;
}

p.expl {
    text-align: center;
    color: #333;
    font-style: normal; 
    font-family: "Indie Flower", serif;
    font-weight: 400;
    font-size: 1.1em;
    margin-top: -0.07em;
}

label {
    color: #343;
    font-weight: 600;
    font-size: 1.05em;
    margin-right: 0.6em;
}

a {
    color: #911;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

a:active {
    color: #800;
}

a.btn {
    display: block;
    border: 1px solid black;
    padding: 0.08em 0.7em;
    text-align: center;
    color: #fff;
    background: #b22;
    text-decoration: none;
}

a.btn:hover {
    background: #800;
}

a.btn:active {
    background: #000;
}

a.btn:after {
    content: " →";
}

a.nav {
    display: block;
    border: 1px solid black;
    padding: 0.08em 0.7em;
    color: #000;
    background: #fff;
    text-decoration: none;
    margin-bottom: 0.35em;
    width: 80%;
    box-shadow: 3px 3px #8e8b89;
}

a.nav:hover {
    color: #fff;
    background: #222;
}

a.nav.sel, a.nav:active {
    color: #fff;
    background: #000;
}
</style>
