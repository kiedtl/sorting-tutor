[package]
name = "sort"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
leptos-use = "0.15"
leptos = { version = "0.7", features = [ "csr" ] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1.7"
rand = "0.9.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
gloo = { version = "0.11", default-features = false, features = ["futures"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
#    "Navigator", "Request", "RequestInit", "RequestMode",
#    "Response", "Storage", "WakeLock", "WakeLockType", "WakeLockSentinel",
#    "Window",
]

[profile.release]
lto = true
